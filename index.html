const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K="jv-k",D=30*864e5;
async function show(k){const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},k,b(P.c));
const t=await new Response(new Blob([p]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
document.open();document.write(t);document.close();}
const imp=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",true,["decrypt"]);
async function derive(pw){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
return crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.s),iterations:600000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},true,["decrypt"]);}

try{const k=await derive(document.getElementById("p").value);

await show(k);
try{localStorage.setItem(K,JSON.stringify({k:btoa(String.fromCharCode(...raw)),e:Date.now()+D}))}catch(_){}
}catch(err){m.textContent="Password sbagliata."}});
